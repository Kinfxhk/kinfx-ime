# encoding: utf-8
# KINFX IME — 粵拼（Jyutping）overlay with hard mixed-input defaults
# Dictionary: uses packaged `jyutping` (Debian librime-data-jyutping / rime-cantonese lineage).
# See NOTICE for CC BY / ODbL attribution requirements.

schema:
  schema_id: kinfx_jyutping
  name: KINFX 粵拼
  version: "0.1.0"
  author:
    - KINFX
  description: |
    香港語言學會粵語拼音；P1 方案。
    中英混打同速成一致（ascii_composer / inline_ascii）。
  dependencies:
    - luna_pinyin

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier
    - uniquifier

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Caps_Lock: clear
    Shift_L: inline_ascii
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - derive/^jy?([aeiou])/y$1/
    - derive/^jyu/ju/
    - derive/yu/y/
    - derive/eoi$/oey/
    - derive/eoi$/eoy/
    - derive/eo/oe/
    - derive/oe(ng|k)$/eo$1/
    - derive/aa$/a/
    - abbrev/^([a-z]).+$/$1/
    - derive/^z/dz/
    - derive/^c/ts/
    - abbrev/^(dz).+$/$1/
    - abbrev/^(ts).+$/$1/

translator:
  dictionary: jyutping
  prism: kinfx_jyutping
  spelling_hints: 5

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|[a-z]+[.].+$"
