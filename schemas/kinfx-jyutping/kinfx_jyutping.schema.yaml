# encoding: utf-8
# KINFX 中英混打輸入法 — 粵拼（Jyutping）with tone digits (rime-cantonese / jyut6ping3)
# Dictionary: system `jyut6ping3` (Debian rime-data-jyut6ping3). See NOTICE.

schema:
  schema_id: kinfx_jyutping
  name: KINFX 中英混打輸入法 · 粵拼
  version: "0.2.0"
  author:
    - KINFX
  description: |
    KINFX 中英混打輸入法（粵拼）。schema_id 係 kinfx_jyutping。
    香港語言學會粵語拼音（有聲調）：例 jyut6、nei5、ngo5；亦可唔打調號。
    混打同速成：預設大寫拉丁零切換；可選 Shift inline_ascii／ascii_mode。
    候選每頁 9 個、選字鍵 1–9、直列。空白＝翻頁；Enter／1–9＝選焦點。同速成。
  dependencies:
    - luna_pinyin

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - lua_processor@win_quick_keys
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier
    - uniquifier
    - lua_filter@win_quick_menu

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Caps_Lock: clear
    Shift_L: inline_ascii
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop

speller:
  # Digits 1–6 = tone marks (jyut6 / nei5); derive strips tones for optional input
  alphabet: zyxwvutsrqponmlkjihgfedcba123456
  delimiter: " '"
  algebra:
    - derive/\d//
    - derive/^jy?([aeiou])/y$1/
    - derive/^jyu/ju/
    - derive/yu(?!ng|k)/y/
    - derive/eoi$/oey/
    - derive/eoi$/eoy/
    - derive/eo/oe/
    - derive/oe(ng|k)$/eo$1/
    - derive/aa$/a/
    - abbrev/^([a-z]).+$/$1/
    - derive/^z/dz/
    - derive/^c/ts/
    - abbrev/^(dz).+$/$1/
    - abbrev/^(ts).+$/$1/

translator:
  dictionary: jyut6ping3
  prism: kinfx_jyutping
  spelling_hints: 5
  vocabulary: essay-cantonese

# 同速成：產品預設每頁 9。前端唔覆蓋。Flex 見 kinfx_jyutping.custom.yaml。
menu:
  page_size: 9
  page_down_cycle: false

punctuator:
  import_preset: default

# 同速成：有候選窗空白／右翻頁、左返頁；Enter 確認焦點。見 docs/WIN_QUICK_SELECT.md。
key_binder:
  import_preset: default
  bindings:
    - { when: has_menu, accept: space, send: Page_Down }
    - { when: has_menu, accept: Right, send: Page_Down }
    - { when: has_menu, accept: KP_Right, send: Page_Down }
    - { when: has_menu, accept: Left, send: Page_Up }
    - { when: has_menu, accept: KP_Left, send: Page_Up }
    - { when: always, accept: Control+Shift+2, toggle: ascii_mode }

editor:
  bindings:
    Return: confirm
    KP_Enter: confirm

style:
  horizontal: false
  inline_preedit: true

win_quick:
  space_pages: true
  hot_page: true
  tab_expand: true
  expand_columns: 4
  vertical: true

recognizer:
  import_preset: default
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|[a-z]+[.].+$"
