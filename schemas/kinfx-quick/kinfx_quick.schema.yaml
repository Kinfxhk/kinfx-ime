# encoding: utf-8
# KINFX IME — 速成（Sucheng / Microsoft Quick–aligned）
# Based on rime-quick ideas (LGPL-3.0 upstream); this schema file is MIT (project LICENSE).
# Dictionary data: see kinfx_quick.dict.yaml + NOTICE.

schema:
  schema_id: kinfx_quick
  name: KINFX 速成
  version: "0.1.1"
  author:
    - KINFX
    - 速成規則／碼表源流見 NOTICE（rime-quick / rime-cangjie）
  description: |
    港式／Windows 微軟速成對齊：倉頡字根鍵盤＋只取首尾二碼。
    候選預設每頁 9 個、選字鍵 1–9（同 Windows 官方速成；唔好改成 5）。
    硬需求：中英混打預設＝全程零切換（大寫拉丁／email／URL 直出）。
    可選：Shift inline_ascii 或 ascii_mode（見 docs／custom 例）。
    佈局變體見 docs/LAYOUTS.md（win_quick = 預設）。排序見 docs/WIN_QUICK_RANK.md。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
    abbrev: [ 中, Ａ ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
    - reverse_lookup_translator
  filters:
    - simplifier
    - uniquifier

# 混打預設：唔靠切 ascii_mode。
# - 大寫拉丁／email／URL → recognizer 直出（零切換；例「今日用 API 測試」）
# - 可選 Shift_L = inline_ascii（臨時西文）；若唔要可喺 custom 改 noop
# - 持久西文：開關 ascii_mode（Control+Shift+2）或 Fcitx5 切鍵盤
# 注意：Fcitx5 預設 LShift 可能搶走 rime inline_ascii（見 README／desktop-verify）
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Caps_Lock: clear
    Shift_L: inline_ascii
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " ;'"
  max_code_length: 2
  auto_select: false

translator:
  dictionary: kinfx_quick
  enable_completion: true
  enable_sentence: true
  enable_user_dict: true
  encode_commit_history: true
  max_phrase_length: 5
  preedit_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz;'|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符··|"
  comment_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz~|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符～|"
  disable_user_dict_for_patterns:
    - "^z.*$"

abc_segmentor:
  extra_tags:
    - reverse_lookup

reverse_lookup:
  dictionary: luna_pinyin
  prism: luna_quanpin
  prefix: "`"
  suffix: "'"
  tips: 〔拼音反查〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

# 產品預設：每頁 9 個，選字鍵 1–9（librime 預設數字鍵；0 唔係本頁選字）。
# 硬需求：所有前端（Fcitx5 classicui、Squirrel、Weasel）跟 schema，唔另設 5。
# 使用者要改先用 kinfx_quick.custom.yaml 的 menu/page_size（見 examples）。
menu:
  page_size: 9

punctuator:
  import_preset: default

key_binder:
  import_preset: default
  bindings:
    - { when: has_menu, accept: space, send: space }
    - { when: always, accept: Control+Shift+2, toggle: ascii_mode }

recognizer:
  import_preset: default
  patterns:
    # 零切換混打主路徑：大寫開頭英詞、email、URL
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|[a-z]+[.].+$"
    reverse_lookup: "`[a-z]*'?$"
