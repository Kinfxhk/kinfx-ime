name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install librime + schema data
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential librime-dev librime-bin \
            rime-data-cangjie5 rime-data-jyut6ping3 rime-essay rime-prelude \
            rime-data-luna-pinyin

      - name: Headless smoke
        run: ./scripts/smoke-linux.sh
